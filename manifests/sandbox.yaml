apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: fsi-mortgage-agent
  namespace: mlflow-demo
  labels:
    app: fsi-mortgage-agent
spec:
  operatingMode: Running
  shutdownPolicy: Retain
  service: false
  podTemplate:
    metadata:
      labels:
        app: fsi-mortgage-agent
    spec:
      serviceAccountName: fsi-mortgage-agent
      containers:
        - name: backend
          image: quay.io/your-org/mlflow-rhoai-demo:latest
          imagePullPolicy: Always
          command:
            - /opt/app-root/src/.venv/bin/mlflow-fsi-agent-serve
          args:
            - --host
            - 0.0.0.0
            - --port
            - "2024"
            - --allow-blocking
          ports:
            - containerPort: 2024
              name: backend-http
          envFrom:
            - secretRef:
                name: fsi-mortgage-agent-env
          env:
            - name: BG_JOB_ISOLATED_LOOPS
              value: "true"
          readinessProbe:
            httpGet:
              path: /healthz
              port: backend-http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: backend-http
            initialDelaySeconds: 15
            periodSeconds: 20
        - name: ui
          image: quay.io/your-org/mlflow-rhoai-demo:latest
          imagePullPolicy: Always
          command: ["node", "ui/server.js"]
          ports:
            - containerPort: 3000
              name: ui-http
          env:
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
            - name: LANGGRAPH_API_URL
              value: http://127.0.0.1:2024
          readinessProbe:
            httpGet:
              path: /
              port: ui-http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: ui-http
            initialDelaySeconds: 15
            periodSeconds: 20
