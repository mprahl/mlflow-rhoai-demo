[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mlflow_notes_agent"]

[project]
name = "mlflow-fsi-mortgage-agent"
version = "0.1.0"
description = "Governed mortgage lending copilot demo using MLflow and Red Hat OpenShift AI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "httpx",
    "kubernetes",
    "langchain",
    "langchain-openai",
    "langgraph-cli[inmem]",
    "langgraph",
    "litellm",
    "mlflow==3.14.0",
    "python-dotenv",
]

[project.scripts]
mlflow-fsi-agent = "mlflow_notes_agent.__main__:main"
mlflow-fsi-agent-serve = "mlflow_notes_agent._serve:main"
mlflow-fsi-agent-judge = "mlflow_notes_agent.judges:main"
mlflow-fsi-agent-evaluate = "mlflow_notes_agent.evaluation_workflow:main"
mlflow-fsi-agent-prompts = "mlflow_notes_agent.prompt_workflow:main"

[dependency-groups]
dev = [
    "ruff",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "SIM",
    "UP",
]

[tool.hatch.metadata]
allow-direct-references = true
